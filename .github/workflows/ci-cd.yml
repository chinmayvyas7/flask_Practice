name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -v

  build-and-push:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" .

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "$IMAGE_URI"

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy container to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: 591667019613.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,MONGO_URI,SECRET_KEY
          script: |
            set -e

            aws ecr get-login-password --region "$AWS_REGION" | \
              sudo docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            sudo docker pull "$IMAGE_URI"

            sudo docker stop flask-practice || true
            sudo docker rm flask-practice || true

            sudo docker run -d \
              --name flask-practice \
              -p 5000:5000 \
              --restart unless-stopped \
              -e MONGO_URI="$MONGO_URI" \
              -e SECRET_KEY="$SECRET_KEY" \
              "$IMAGE_URI"

            sleep 5

            for i in {1..12}; do
              if curl -fsS http://localhost:5000/health; then
                echo "Health check PASSED"
                exit 0
              fi

              sleep 5
            done

            sudo docker ps -a
            sudo docker logs flask-practice || true
            exit 1

  notify:
    name: Email Notification
    needs:
      - test
      - build-and-push
      - deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Determine pipeline result
        id: result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "status=FAILURE" >> "$GITHUB_OUTPUT"
            echo "stage=test" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.build-and-push.result }}" != "success" ]; then
            echo "status=FAILURE" >> "$GITHUB_OUTPUT"
            echo "stage=build/push" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "status=FAILURE" >> "$GITHUB_OUTPUT"
            echo "stage=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "stage=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Send success email
        if: steps.result.outputs.status == 'SUCCESS'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[SUCCESS] Flask CI/CD Deployment"
          body: |
            Flask CI/CD deployment completed successfully.

            Commit SHA: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Docker image tag: ${{ github.sha }}
            ECR repository: ${{ secrets.ECR_REPOSITORY }}
            EC2 target: ${{ secrets.EC2_HOST }}

            Health endpoint:
            http://${{ secrets.EC2_HOST }}:5000/health

            Pipeline:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: steps.result.outputs.status == 'FAILURE'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[FAILURE] Flask CI/CD Pipeline"
          body: |
            Flask CI/CD pipeline FAILED.

            Failed stage: ${{ steps.result.outputs.stage }}
            Commit SHA: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            Pipeline:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}