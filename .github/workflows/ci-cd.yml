name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:

  # ============================================================
  # 1. CHECKOUT + INSTALL + TEST
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          pytest -v

  # ============================================================
  # 2. BUILD + PUSH TO ECR
  # ============================================================
  build-and-push:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image information
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "Docker image tag: ${IMAGE_TAG}"
          echo "ECR image: ${IMAGE_URI}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.uri }}" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image.outputs.uri }}"

  # ============================================================
  # 3. DEPLOY TO EC2 + HEALTH CHECK
  # ============================================================
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy container to EC2
        id: deployment
        uses: appleboy/ssh-action@v1.2.2
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: 591667019613.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,IMAGE_URI,MONGO_URI,SECRET_KEY
          script: |
            set -e

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password --region "$AWS_REGION" | \
              sudo docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            echo "Pulling image:"
            echo "$IMAGE_URI"

            sudo docker pull "$IMAGE_URI"

            echo "Stopping existing container..."

            sudo docker stop flask-practice || true
            sudo docker rm flask-practice || true

            echo "Starting new container..."

            sudo docker run -d \
              --name flask-practice \
              -p 5000:5000 \
              --restart unless-stopped \
              -e MONGO_URI="$MONGO_URI" \
              -e SECRET_KEY="$SECRET_KEY" \
              "$IMAGE_URI"

            echo "Waiting for application to start..."

            for i in {1..12}; do
              if curl -fsS http://localhost:5000/health; then
                echo ""
                echo "Health check passed."
                exit 0
              fi

              echo "Health check attempt $i failed. Retrying..."
              sleep 5
            done

            echo "Health check failed."

            echo "Container status:"
            sudo docker ps -a

            echo "Container logs:"
            sudo docker logs flask-practice || true

            exit 1