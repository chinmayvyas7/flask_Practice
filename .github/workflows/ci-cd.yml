  # ============================================================
  # 4. EMAIL NOTIFICATION
  # ============================================================
  notify:
    name: Email Notification
    needs:
      - test
      - build-and-push
      - deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Determine pipeline result
        id: result
        shell: bash
        run: |
          TEST_RESULT="${{ needs.test.result }}"
          BUILD_RESULT="${{ needs.build-and-push.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"

          if [ "$TEST_RESULT" != "success" ]; then
            STATUS="FAILURE"
            STAGE="test"
          elif [ "$BUILD_RESULT" != "success" ]; then
            STATUS="FAILURE"
            STAGE="build/push"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            STATUS="FAILURE"
            STAGE="deploy"
          else
            STATUS="SUCCESS"
            STAGE="none"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Send success email
        if: steps.result.outputs.status == 'SUCCESS'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[SUCCESS] Flask CI/CD Deployment"
          body: |
            Flask CI/CD deployment completed successfully.

            Commit SHA:
            ${{ github.sha }}

            Branch:
            ${{ github.ref_name }}

            Docker image tag:
            ${{ github.sha }}

            ECR repository:
            ${{ secrets.ECR_REPOSITORY }}

            EC2 target:
            ${{ secrets.EC2_HOST }}

            Health endpoint:
            http://${{ secrets.EC2_HOST }}:5000/health

            Pipeline run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Result:
            SUCCESS

      - name: Send failure email
        if: steps.result.outputs.status == 'FAILURE'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[FAILURE] Flask CI/CD Pipeline"
          body: |
            Flask CI/CD pipeline FAILED.

            Failed stage:
            ${{ steps.result.outputs.stage }}

            Commit SHA:
            ${{ github.sha }}

            Branch:
            ${{ github.ref_name }}

            Pipeline run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Repository:
            ${{ github.server_url }}/${{ github.repository }}

            Please inspect the failed stage and logs.

            Result:
            FAILURE